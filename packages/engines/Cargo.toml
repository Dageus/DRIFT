[workspace]
resolver = "2"
members = ["core", "server", "risc0/methods"]
# The RISC Zero methods crate compiles its guest with the risc0 toolchain. Leaving it out of the
# default members keeps `cargo build` and `cargo test` working with a stock Rust toolchain.
default-members = ["core", "server"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Dageus/DRIFT"

[workspace.dependencies]
drift-engine-core = { path = "core" }
drift-engine-methods = { path = "risc0/methods" }
alloy-primitives = { version = "1", default-features = false }
alloy-sol-types = { version = "1", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
