[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "scripts"
evm_version = "cancun"

[profile.dev]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[profile.ci]
optimizer = true
optimizer_runs = 10_000
via_ir = true
evm_version = "cancun"

[fuzz]
runs = 1000

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
