name: Contracts CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/contracts/**'
  pull_request:
    paths:
      - 'packages/contracts/**'

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Gas snapshot drift check
        run: forge snapshot --check
